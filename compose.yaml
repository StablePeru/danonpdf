services:
  build:
    build:
      context: .
      args:
        # The non-root user in the image. On Linux, match your own user so the
        # bind-mounted checkout stays writable:
        #   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose build build
        # (bash keeps UID read-only, hence the HOST_ prefix.)
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: danonpdf-build:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      # Crate registry and build output: see the comment in the Dockerfile.
      - cargo-home:/home/builder/.cargo
      - cargo-target:/home/builder/target

# A named volume keeps the owner it got the first time it was used. After
# changing HOST_UID/HOST_GID, remove them (docker compose down --volumes).
volumes:
  cargo-home:
  cargo-target:
# The commands to build, check and test are listed in the README, under
# "Build and test".
